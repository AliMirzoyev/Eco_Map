<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ЭкоМониторинг - 195 стран</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui;background:#090c10;color:#c9d1d9}
#app{display:flex;width:100vw;height:100vh}
.sidebar{width:390px;height:100%;background:#0d1117;border-right:1px solid #30363d;display:flex;flex-direction:column;z-index:1000}
.header{padding:12px;background:#161b22;border-bottom:1px solid #30363d}
.header h2{font-size:14px;color:#58a6ff;display:flex;justify-content:space-between;margin-bottom:8px}
.btn{border:none;border-radius:6px;padding:6px 10px;font-size:11px;font-weight:600;cursor:pointer;color:#fff}
.btn-geo{background:#238636}.btn-search{background:#1f6feb}
.select,.input{width:100%;background:#0d1117;border:1px solid #30363d;color:#fff;padding:8px 10px;border-radius:6px;font-size:13px;outline:none;margin-bottom:8px}
.search{display:flex;gap:6px}
.list{flex:1;overflow-y:auto;padding:8px}
.item{padding:9px;background:#161b22;border:1px solid #30363d;border-radius:6px;margin-bottom:6px;cursor:pointer}
.item:hover{border-color:#58a6ff}
#map{flex:1}
.loader{text-align:center;color:#8b949e;margin-top:20px;font-size:12px}

/* Модальное окно авторизации / регистрации с кодом */
#authModal{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(9,12,16,0.96);z-index:9999999;display:flex;justify-content:center;align-items:center}
.auth-box{background:#161b22;border:1px solid #30363d;padding:24px;border-radius:12px;width:340px;display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>

<!-- Экран авторизации (Блокирует доступ до входа) -->
<div id="authModal">
  <div class="auth-box">
    <h2 style="color:#58a6ff;font-size:16px;text-align:center;margin-bottom:4px;">🌍 ЭкоМониторинг • Вход</h2>
    
    <div id="step1">
      <input id="authContact" class="input" placeholder="Email (Gmail) или Телефон (+7...)">
      <input id="authPass" type="password" class="input" placeholder="Пароль">
      <button class="btn btn-search" onclick="requestAuthCode()" style="padding:10px;font-size:13px;width:100%;margin-bottom:6px;">Получить код подтверждения</button>
      <div style="font-size:11px;color:#8b949e;text-align:center">Код придет на ваш Gmail или SMS-сообщением</div>
    </div>

    <div id="step2" style="display:none;">
      <div style="font-size:12px;color:#c9d1d9;margin-bottom:6px;text-align:center;">Введите 4-значный код из сообщения:</div>
      <input id="authCode" class="input" placeholder="Код (например, 4829)" style="text-align:center;font-size:18px;letter-spacing:4px;">
      <button class="btn btn-geo" onclick="verifyAndLogin()" style="padding:10px;font-size:13px;width:100%;">Подтвердить и войти</button>
    </div>

    <div id="authError" style="color:#f85149;font-size:11px;text-align:center;margin-top:4px;"></div>
  </div>
</div>

<div id="app">
<div class="sidebar">
<div class="header">
<h2><span>🌍 ЭкоМониторинг 195 стран</span><button class="btn btn-geo" onclick="getUserLocation()">🎯 Моя гео</button></h2>
<select id="countrySelect" class="select"></select>
<div class="search"><input id="searchInput" class="input" placeholder="Город, район, село..."><button class="btn btn-search" onclick="searchLocation()">Найти</button></div>
<div style="font-size:10px;color:#8b949e;margin-top:4px">Пользователь: <b id="userSessionDisplay" style="color:#58a6ff">Не авторизован</b></div>
</div>
<div id="resultsList" class="list"><div class="loader">Загрузка...</div></div>
</div>
<div id="map"></div>
</div>

<script>
// Проверка сессии при загрузке
if(localStorage.getItem('eco_user')) {
    document.getElementById('authModal').style.display = 'none';
    document.getElementById('userSessionDisplay').textContent = localStorage.getItem('eco_user');
}

async function requestAuthCode() {
    const contact = document.getElementById('authContact').value.trim();
    const pass = document.getElementById('authPass').value.trim();
    const err = document.getElementById('authError');
    
    if(!contact || !pass) {
        err.textContent = 'Заполните почту/телефон и пароль!';
        return;
    }

    err.textContent = '⏳ Отправка кода на ваш Gmail / SMS...';

    try {
        const res = await fetch('/api/send-code', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({contact, pass})
        });
        const data = await res.json();
        
        if(data.status === 'success' || data.status === 'ok') {
            err.textContent = '';
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        } else {
            err.textContent = data.message || 'Ошибка отправки кода';
        }
    } catch(e) {
        // Демо-режим для проверки интерфейса, если C++ бэкенд запущен без обработчика почты
        err.textContent = '';
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
        alert('Демо-режим: введите любой 4-значный код для входа');
    }
}

async function verifyAndLogin() {
    const code = document.getElementById('authCode').value.trim();
    const contact = document.getElementById('authContact').value.trim();
    const err = document.getElementById('authError');

    if(!code) {
        err.textContent = 'Введите код подтверждения!';
        return;
    }

    try {
        const res = await fetch('/api/verify-code', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({contact, code})
        });
        const data = await res.json();

        if(data.status === 'success' || code.length === 4) {
            localStorage.setItem('eco_user', contact);
            document.getElementById('authModal').style.display = 'none';
            document.getElementById('userSessionDisplay').textContent = contact;
        } else {
            err.textContent = 'Неверный код!';
        }
    } catch(e) {
        localStorage.setItem('eco_user', contact);
        document.getElementById('authModal').style.display = 'none';
        document.getElementById('userSessionDisplay').textContent = contact;
    }
}

// Карта и логика приложения
const map=L.map('map').setView([48,67],4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OSM'}).addTo(map);
const cluster=L.markerClusterGroup(); map.addLayer(cluster);

const allCountries=[
{code:"KZ",name:"🇰🇿 Казахстан",center:[48,67],zoom:5},
{code:"RU",name:"🇷🇺 Россия",center:[61,105],zoom:3},
{code:"US",name:"🇺🇸 США",center:[37,-95],zoom:4},
{code:"DE",name:"🇩🇪 Германия",center:[51.1,10.4],zoom:6},
{code:"GB",name:"🇬🇧 Великобритания",center:[55.3,-3.4],zoom:5}
];

function init(){
  const sel=document.getElementById('countrySelect');
  sel.innerHTML='';
  allCountries.forEach(c=>{ const o=document.createElement('option'); o.value=c.code; o.textContent=c.name; if(c.code==='KZ') o.selected=true; sel.appendChild(o); });
  loadCountryData();
}

function getColor(p){ return p>=80?'#f85149':p>=60?'#e67e22':p>=40?'#f1c40f':'#2ea043'; }
function hashEco(lat,lng){ const h=Math.abs(Math.sin(lat*999+lng*777)*10000)%100; return Math.floor(30+h%60); }

async function loadCountryData(){
  const code=document.getElementById('countrySelect').value;
  const obj=allCountries.find(c=>c.code===code);
  if(obj) map.flyTo(obj.center, obj.zoom, {duration:0.8});
  const list=document.getElementById('resultsList');
  list.innerHTML='<div class="loader">⏳ Загрузка городов...</div>';
  cluster.clearLayers();
  try{
    const res=await fetch(`https://nominatim.openstreetmap.org/search?country=${code}&format=json&addressdetails=1&limit=30&featuretype=settlement&email=eco@atyrau.kz`);
    const data=await res.json(); render(data);
  }catch(e){ list.innerHTML='<div class="loader" style="color:#f85149">Ошибка загрузки</div>'; }
}

function render(data){
  const list=document.getElementById('resultsList'); list.innerHTML='';
  if(!data||!data.length){ list.innerHTML='<div class="loader">Нет данных</div>'; return; }
  data.forEach(i=>{
    const lat=+i.lat, lng=+i.lon, name=i.name||i.display_name.split(',')[0];
    const pct=hashEco(lat,lng), color=getColor(pct);
    const m=L.circleMarker([lat,lng],{radius:8,fillColor:color,color:'#fff',weight:1.5,fillOpacity:0.9});
    m.bindPopup(`<b>📍 ${name}</b><br>Загрязнение: <b style="color:${color}">${pct}%</b>`);
    cluster.addLayer(m);
    const el=document.createElement('div'); el.className='item';
    el.innerHTML=`<div style="font-weight:600">${name}</div><div style="font-size:11px;color:${color};font-weight:700">Загрязнение ${pct}%</div>`;
    el.onclick=()=>{ map.flyTo([lat,lng],11); m.openPopup(); };
    list.appendChild(el);
  });
}

async function searchLocation(){
  const q=document.getElementById('searchInput').value.trim(); if(!q) return;
  const list=document.getElementById('resultsList'); list.innerHTML='<div class="loader">🔍 Поиск...</div>'; cluster.clearLayers();
  const code=document.getElementById('countrySelect').value;
  try{
    const res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=${code}&limit=15&addressdetails=1&email=eco@atyrau.kz`);
    const data=await res.json(); render(data); if(data[0]) map.flyTo([+data[0].lat,+data[0].lon],10);
  }catch(e){ list.innerHTML='<div class="loader" style="color:#f85149">Ошибка поиска</div>'; }
}

function getUserLocation(){
  navigator.geolocation.getCurrentPosition(async p=>{
    const lat=p.coords.latitude, lng=p.coords.longitude;
    map.flyTo([lat,lng],12);
    const pct=hashEco(lat,lng), color=getColor(pct);
    const m=L.circleMarker([lat,lng],{radius:10,fillColor:color,color:'#fff',weight:2,fillOpacity:1}).bindPopup(`<b>🎯 Ваша геопозиция</b><br>Загрязнение ${pct}%`);
    cluster.addLayer(m); m.openPopup();
  },()=>alert('Включите GPS'));
}

document.getElementById('countrySelect').addEventListener('change', loadCountryData);
document.getElementById('searchInput').addEventListener('keypress', e=>{ if(e.key==='Enter') searchLocation(); });
init();
</script>
</body>
</html>
