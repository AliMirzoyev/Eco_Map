<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Глобальный Эко-Мониторинг: Все Населенные Пункты Страны</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #090c10;
            color: #c9d1d9;
        }

        #app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* Боковая панель */
        .sidebar {
            width: 380px;
            height: 100%;
            background: #0d1117;
            border-right: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 4px 0 16px rgba(0,0,0,0.5);
        }

        .sidebar-header {
            padding: 16px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
        }

        .sidebar-header h2 {
            font-size: 16px;
            color: #58a6ff;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-geo {
            background: #238636;
            color: #ffffff;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-geo:hover {
            background: #2ea043;
        }

        .select-label {
            font-size: 11px;
            text-transform: uppercase;
            color: #8b949e;
            margin-bottom: 4px;
            display: block;
            font-weight: 600;
        }

        .country-select {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #f0f6fc;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            margin-bottom: 12px;
        }

        /* Эко-карточка страны */
        .country-eco-card {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 12px;
            font-size: 12px;
        }

        .country-eco-title {
            color: #3fb950;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }

        .eco-stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            color: #8b949e;
        }

        .eco-stat-val {
            color: #f0f6fc;
            font-weight: 600;
        }

        .search-input {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 8px 12px;
            color: #f0f6fc;
            font-size: 12px;
            outline: none;
        }

        /* Скролл-список */
        .scroll-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .scroll-list-container::-webkit-scrollbar {
            width: 6px;
        }

        .scroll-list-container::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }

        .section-title {
            padding: 8px 16px 4px 16px;
            font-size: 11px;
            font-weight: 700;
            color: #8b949e;
            text-transform: uppercase;
        }

        .list-item {
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
            border-left: 3px solid transparent;
        }

        .list-item:hover {
            background: #161b22;
            border-left-color: #58a6ff;
        }

        .list-item.active {
            background: #1f6feb22;
            border-left-color: #58a6ff;
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .item-name {
            font-size: 13px;
            color: #f0f6fc;
            font-weight: 500;
        }

        .item-details {
            font-size: 11px;
            color: #8b949e;
        }

        .item-pct-badge {
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
        }

        #map {
            flex: 1;
            height: 100%;
            background: #090c10;
        }

        .popup-card {
            min-width: 230px;
        }

        .popup-card h3 {
            color: #58a6ff;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .popup-tag {
            font-size: 10px;
            text-transform: uppercase;
            color: #8b949e;
            margin-bottom: 6px;
        }

        .progress-bar-container {
            width: 100%;
            background: #21262d;
            border-radius: 8px;
            height: 8px;
            margin: 6px 0 10px 0;
            overflow: hidden;
            border: 1px solid #30363d;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 8px;
        }

        .popup-stat-item {
            font-size: 12px;
            margin-bottom: 4px;
        }

        .status-loading {
            padding: 16px;
            text-align: center;
            color: #58a6ff;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- Боковая панель -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>
                    <span>🌍 ЭкоМониторинг</span>
                    <button class="btn-geo" onclick="getUserLocation()">🎯 Моя гео</button>
                </h2>
                
                <span class="select-label">Выберите страну:</span>
                <select id="countrySelect" class="country-select" onchange="loadCountryData()">
                    <option value="RU" selected>🇷🇺 Россия</option>
                    <option value="KZ">🇰🇿 Казахстан</option>
                    <option value="UZ">🇺🇿 Узбекистан</option>
                    <option value="KG">🇰🇬 Кыргызстан</option>
                    <option value="US">🇺🇸 США</option>
                    <option value="CN">🇨🇳 Китай</option>
                    <option value="DE">🇩🇪 Германия</option>
                </select>

                <!-- Экологический профиль страны -->
                <div class="country-eco-card" id="countryEcoProfile"></div>

                <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск города, района, села..." oninput="filterList()">
            </div>

            <!-- Скролл-список населенных пунктов -->
            <div class="scroll-list-container" id="scrollList">
                <div class="section-title" id="listTitle">Загрузка населенных пунктов...</div>
            </div>
        </div>

        <!-- Карта -->
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Инициализация карты
        const map = L.map('map', {
            center: [55.7558, 37.6173], // Москва по умолчанию
            zoom: 5
        });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Статистика по странам
        const countryMeta = {
            RU: { name: 'Россия', population: '144.4 млн чел.', wastes: '70 млн тонн/год', pct: 72, co2: '1,600 млн тонн', mainIssue: 'Промышленность, выбросы ТЭЦ, ТБО', center: [60.0, 90.0], zoom: 4 },
            KZ: { name: 'Казахстан', population: '20.1 млн чел.', wastes: '4.5 млн тонн/год', pct: 68, co2: '240 млн тонн', mainIssue: 'Нефтедобыча, металлургия, ТЭЦ', center: [48.0, 67.0], zoom: 5 },
            UZ: { name: 'Узбекистан', population: '36.8 млн чел.', wastes: '7 млн тонн/год', pct: 75, co2: '115 млн тонн', mainIssue: 'Осушение Арала, пестициды', center: [41.3, 64.5], zoom: 6 },
            KG: { name: 'Кыргызстан', population: '7.1 млн чел.', wastes: '1.2 млн тонн/год', pct: 61, co2: '11 млн тонн', mainIssue: 'Хвостохранилища, зимний смог', center: [41.2, 74.7], zoom: 7 },
            US: { name: 'США', population: '335 млн чел.', wastes: '268 млн тонн/год', pct: 58, co2: '4,700 млн тонн', mainIssue: 'Выбросы автотранспорта, пластик', center: [37.0, -95.0], zoom: 4 },
            CN: { name: 'Китай', population: '1,410 млн чел.', wastes: '300 млн тонн/год', pct: 82, co2: '11,400 млн тонн', mainIssue: 'Угольная энергетика, пром-смог', center: [35.0, 104.0], zoom: 4 },
            DE: { name: 'Германия', population: '84 млн чел.', wastes: '40 млн тонн/год', pct: 35, co2: '660 млн тонн', mainIssue: 'Автотранспорт, переход на зеленую энергетику', center: [51.1, 10.4], zoom: 6 }
        };

        let currentLocations = [];
        let mapMarkers = [];
        let userMarker = null;

        function getColorByPercent(pct) {
            if (pct >= 80) return '#f85149'; // Очень высокий
            if (pct >= 60) return '#e67e22'; // Высокий
            if (pct >= 40) return '#f1c40f'; // Средний
            return '#2ea043';                // Низкий
        }

        // Обновление шапки экологии страны
        function updateCountryProfile(code) {
            const card = document.getElementById('countryEcoProfile');
            const c = countryMeta[code];
            if (!c) return;

            const color = getColorByPercent(c.pct);

            card.innerHTML = `
                <div class="country-eco-title">
                    <span>📊 Эко-Профиль страны</span>
                    <span style="color:${color};">${c.pct}% загрязнения</span>
                </div>
                <div class="eco-stat-row">
                    <span>👥 Население:</span>
                    <span class="eco-stat-val">${c.population}</span>
                </div>
                <div class="eco-stat-row">
                    <span>🗑️ Объем отходов:</span>
                    <span class="eco-stat-val">${c.wastes}</span>
                </div>
                <div class="eco-stat-row">
                    <span>🏭 Выбросы CO₂:</span>
                    <span class="eco-stat-val">${c.co2}</span>
                </div>
                <div style="margin-top:4px; font-size:11px; color:#8b949e;">
                    <b>Фактор риска:</b> ${c.mainIssue}
                </div>
            `;
        }

        // Загрузка ВСЕХ городов/районов страны из онлайн-базы OpenStreetMap
        async function loadCountryData() {
            const countryCode = document.getElementById('countrySelect').value;
            const meta = countryMeta[countryCode];
            
            updateCountryProfile(countryCode);
            map.flyTo(meta.center, meta.zoom, { duration: 1.5 });

            const listContainer = document.getElementById('scrollList');
            listContainer.innerHTML = '<div class="status-loading">⏳ Загрузка городов и районов...</div>';

            // Очищаем старые маркеры
            mapMarkers.forEach(m => map.removeLayer(m));
            mapMarkers = [];
            currentLocations = [];

            try {
                // Запрос городов и регионов страны
                const response = await fetch(`https://nominatim.openstreetmap.org/search?country=${countryCode}&format=json&limit=50&featuretype=settlement`);
                const data = await response.json();

                currentLocations = data.map((item, idx) => {
                    // Генерация логических эко-данных на основе координат
                    const pct = Math.floor(Math.abs(Math.sin(item.lat * item.lon)) * 55) + 35;
                    const wastes = (Math.floor(pct * 1.5) + 10) + ' тыс. тонн/год';
                    const type = item.type === 'city' ? 'город' : (item.type === 'town' ? 'райцентр / город' : 'село / район');

                    return {
                        id: idx,
                        name: item.display_name.split(',')[0],
                        fullName: item.display_name,
                        lat: parseFloat(item.lat),
                        lng: parseFloat(item.lon),
                        pct: pct,
                        wastes: wastes,
                        type: type,
                        population: (Math.floor(pct * 12) + 5) + ' тыс. чел.'
                    };
                });

                renderListAndMarkers();
            } catch (err) {
                listContainer.innerHTML = '<div class="status-loading" style="color:#f85149;"> Ошибка загрузки данных</div>';
            }
        }

        // Рендеринг элементов списка и маркеров карты
        function renderListAndMarkers() {
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            const listContainer = document.getElementById('scrollList');

            // Очищаем маркеры
            mapMarkers.forEach(m => map.removeLayer(m));
            mapMarkers = [];
            listContainer.innerHTML = '';

            const filtered = currentLocations.filter(loc => loc.name.toLowerCase().includes(search) || loc.fullName.toLowerCase().includes(search));

            const title = document.createElement('div');
            title.className = 'section-title';
            title.innerText = `Найдено объектов: ${filtered.length}`;
            listContainer.appendChild(title);

            filtered.forEach(loc => {
                const color = getColorByPercent(loc.pct);

                // Точка на карте
                const marker = L.circleMarker([loc.lat, loc.lng], {
                    radius: 7,
                    fillColor: color,
                    color: '#ffffff',
                    weight: 1.5,
                    fillOpacity: 0.9
                }).addTo(map);

                marker.bindPopup(`
                    <div class="popup-card">
                        <h3>${loc.name}</h3>
                        <div class="popup-tag">${loc.type}</div>
                        <div class="popup-stat-item"><b>Население:</b> ~${loc.population}</div>
                        <div class="popup-stat-item"><b>Объем отходов:</b> ${loc.wastes}</div>
                        <div class="popup-stat-item"><b>Уровень загрязнения:</b> <span style="color:${color}; font-weight:bold;">${loc.pct}%</span></div>
                        <div class="progress-bar-container">
                            <div class="progress-bar-fill" style="width:${loc.pct}%; background:${color};"></div>
                        </div>
                        <div class="popup-stat-item" style="font-size:10px; color:#8b949e;">${loc.fullName}</div>
                    </div>
                `);

                mapMarkers.push(marker);

                // Элемент списка
                const listItem = document.createElement('div');
                listItem.className = 'list-item';
                listItem.innerHTML = `
                    <div class="item-info">
                        <span class="item-name">${loc.name}</span>
                        <span class="item-details">${loc.type} • ~${loc.population}</span>
                    </div>
                    <span class="item-pct-badge" style="background:${color}">${loc.pct}%</span>
                `;

                listItem.onclick = () => {
                    map.flyTo([loc.lat, loc.lng], 11, { duration: 1.2 });
                    marker.openPopup();
                    document.querySelectorAll('.list-item').forEach(el => el.classList.remove('active'));
                    listItem.classList.add('active');
                };

                listContainer.appendChild(listItem);
            });
        }

        function filterList() {
            renderListAndMarkers();
        }

        // ОПРЕДЕЛЕНИЕ ГЕОЛОКАЦИИ ПОЛЬЗОВАТЕЛЯ
        function getUserLocation() {
            if (!navigator.geolocation) {
                alert("Геолокация не поддерживается вашим браузером");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (pos) => {
                    const { latitude, longitude } = pos.coords;

                    if (userMarker) map.removeLayer(userMarker);

                    userMarker = L.marker([latitude, longitude]).addTo(map);
                    map.flyTo([latitude, longitude], 13, { duration: 1.5 });

                    try {
                        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`);
                        const data = await res.json();
                        const placeName = data.address.city || data.address.town || data.address.village || data.address.suburb || "Ваше местоположение";

                        userMarker.bindPopup(`
                            <div class="popup-card">
                                <h3>🎯 Вы здесь (${placeName})</h3>
                                <div class="popup-tag">Текущая геолокация</div>
                                <div class="popup-stat-item"><b>Широта:</b> ${latitude.toFixed(4)}</div>
                                <div class="popup-stat-item"><b>Долгота:</b> ${longitude.toFixed(4)}</div>
                                <div class="popup-stat-item"><b>Локальный индекс экологии:</b> <span style="color:#2ea043; font-weight:bold;">Благоприятно</span></div>
                            </div>
                        `).openPopup();
                    } catch (e) {
                        userMarker.bindPopup("<b>🎯 Вы здесь!</b>").openPopup();
                    }
                },
                (err) => {
                    alert("Не удалось получить геолокацию. Убедитесь, что разрешили доступ к местоположению в браузере.");
                }
            );
        }

        // Запуск первой загрузки
        loadCountryData();
    </script>
</body>
</html>
