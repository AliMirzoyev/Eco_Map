<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЭкоMonitoring 195 стран</title>
    <!-- Подключаем Leaflet CSS для карты -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #121824;
            color: #fff;
        }
        #map {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .sidebar {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: #1a2234;
            padding: 20px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        .sidebar h2 {
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #16a34a;
        }
        .btn-blue {
            background: #3b82f6;
        }
        .btn-blue:hover {
            background: #2563eb;
        }
        select, input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            outline: none;
        }
        select:focus, input:focus {
            border-color: #3b82f6;
        }
        .search-box {
            display: flex;
            gap: 5px;
        }
        .user-info {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 12px;
            word-break: break-all;
        }
        .user-email {
            color: #60a5fa;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>🌍 ЭкоMonitoring 195 стран</h2>
        <button class="btn" style="width: 100%; margin-bottom: 12px;">📍 Моя гео</button>
        
        <select id="citySelect">
            <option value="">Выберите город...</option>
        </select>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Город, район, село...">
            <button class="btn btn-blue" style="height: 41px;">Найти</button>
        </div>

        <div class="user-info">
            Пользователь: <span class="user-email">ali.mirzayev.am3@gmail.com</span>
        </div>
    </div>

    <div id="map"></div>

    <!-- Подключаем Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Инициализация карты
        const map = L.map('map', { zoomControl: false }).setView([48.8566, 2.3522], 4);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Загружаем данные датчиков с нашего C++ сервера
        fetch('/api/sensors')
            .then(response => response.json())
            .then(data => {
                const select = document.getElementById('citySelect');
                data.forEach(sensor => {
                    // Ставим маркер на карту
                    L.marker([sensor.lat, sensor.lon])
                      .addTo(map)
                      .bindPopup(`<b>${sensor.city}, ${sensor.country}</b><br>Индекс AQI: ${sensor.aqi}`);

                    // Заполняем выпадающий список
                    const option = document.createElement('option');
                    option.value = sensor.city;
                    option.textContent = `${sensor.city} (${sensor.country}) - AQI: ${sensor.aqi}`;
                    select.appendChild(option);
                });
            })
            .catch(err => console.error('Ошибка загрузки датчиков:', err));
    </script>
</body>
</html>
