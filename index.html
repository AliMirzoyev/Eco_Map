<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui;background:#090c10;color:#c9d1d9}
#app{display:flex;width:100vw;height:100vh}
.sidebar{width:390px;height:100%;background:#0d1117;border-right:1px solid #30363d;display:flex;flex-direction:column;z-index:1000}
.header{padding:10px;background:#161b22;border-bottom:1px solid #30363d}
.header h2{font-size:13px;color:#58a6ff;display:flex;justify-content:space-between;margin-bottom:6px}
.btn{border:none;border-radius:6px;padding:5px 8px;font-size:11px;font-weight:600;cursor:pointer;color:#fff}
.btn-geo{background:#238636}
.btn-search{background:#1f6feb}

.custom-select-wrapper {
    position: relative;
    user-select: none;
    margin-bottom: 6px;
}
.custom-select {
    width: 100%;
    background: #21262d;
    border: 1px solid #58a6ff;
    color: #ffffff;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.custom-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    margin-top: 4px;
    max-height: 180px;
    overflow-y: auto;
    display: none;
    z-index: 9999;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}
.custom-dropdown.open {
    display: block;
}
.custom-option {
    padding: 8px 10px;
    font-size: 12px;
    color: #c9d1d9;
    cursor: pointer;
}
.custom-option:hover {
    background: #21262d;
    color: #ffffff;
}

.input{width:100%;background:#0d1117;border:1px solid #30363d;color:#fff;padding:7px 9px;border-radius:6px;font-size:12px;outline:none;margin-bottom:6px}
.search{display:flex;gap:6px}
.list{flex:1;overflow-y:auto;padding:6px;max-height:160px;}
.item{padding:8px;background:#161b22;border:1px solid #30363d;border-radius:6px;margin-bottom:5px;cursor:pointer}
.item:hover{border-color:#58a6ff}
#map{flex:1}
.loader{text-align:center;color:#8b949e;margin-top:10px;font-size:11px}

.ai-box {
    margin: 8px;
    background: #161b22;
    border: 1px solid #30363d;
    border-left: 3px solid #58a6ff;
    border-radius: 6px;
    padding: 10px;
    font-size: 11px;
    line-height: 1.4;
    color: #e2e8f0;
}
.ai-title {
    color: #58a6ff;
    font-weight: bold;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.ai-content {
    max-height: 100px;
    overflow-y: auto;
    padding-right: 4px;
    padding-bottom: 2px;
}

#aiBottom{
  height:auto;
  min-height:110px;
  flex-shrink:0;
  border-top:1px solid #30363d;
  background:#0d1117;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
#aiMiniRow{
  display:flex;
  gap:8px;
  align-items:center;
}
#aiMiniInput{
  flex:1;
  background:#0d1117;
  border:1px solid #30363d;
  color:#fff;
  padding:10px 12px;
  border-radius:8px;
  font-size:13px;
  outline:none;
  margin-bottom: 0 !important;
}
#aiMiniInput:focus{border-color:#58a6ff}
#aiMiniBtn{
  background:#1f6feb;
  color:#fff;
  border:none;
  border-radius:8px;
  padding:10px 18px;
  font-weight:700;
  font-size:13px;
  cursor:pointer;
  white-space:nowrap;
}
#aiMiniBtn:hover{background:#388bfd}
#aiMiniLabel{
  font-size:10px;
  color:#8b949e;
  display:flex;
  justify-content:space-between;
}
#aiMiniChat{
  max-height:90px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:4px;
  font-size:11px;
}

@media (max-width: 768px){
  #app{flex-direction:column}
  .sidebar{width:100%!important;height:55vh!important;border-right:none;border-bottom:2px solid #30363d;order:2}
  #map{width:100%!important;height:45vh!important;order:1;flex:none!important}
  .header{padding:8px}
  .custom-select,.input{font-size:15px!important}

#mobileToggle{

}
@media (max-width:768px){#mobileToggle{display:block}}

function init(){
  const trigger = document.getElementById('customSelectTrigger');
  const dropdown = document.getElementById('customDropdown');
  const hiddenInput = document.getElementById('countrySelect');
  
  dropdown.innerHTML = '';
  allCountries.forEach(c => {
    const opt = document.createElement('div');
    opt.className = 'custom-option';
    opt.textContent = c.name;
    opt.onclick = (e) => {
      e.stopPropagation();
      hiddenInput.value = c.code;
      trigger.innerHTML = `${c.name} <span style="font-size:10px">▼</span>`;
      dropdown.classList.remove('open');
      loadCountryData();
    };
    dropdown.appendChild(opt);
  });

  trigger.onclick = (e) => {
    e.stopPropagation();
    dropdown.classList.toggle('open');
  };

  document.addEventListener('click', () => {
    dropdown.classList.remove('open');
  });

  document.getElementById('count').textContent = allCountries.length;
  loadCountryData();
}

function getColor(p){ return p>=80?'#f85149':p>=60?'#e67e22':p>=40?'#f1c40f':'#2ea043'; }
function hashEco(lat,lng){ const h=Math.abs(Math.sin(lat*999+lng*777)*10000)%100; return Math.floor(30+h%60); }

let cache = JSON.parse(localStorage.getItem('eco_cache') || '{}');
function saveCache(){ localStorage.setItem('eco_cache', JSON.stringify(cache)); }

let lastRequestTime = 0;
async function fetchWithThrottle(url) {
    const now = Date.now();
    const diff = now - lastRequestTime;
    if (diff < 1200) {
        await new Promise(resolve => setTimeout(resolve, 1200 - diff));
    }
    lastRequestTime = Date.now();
    
    // Используем AbortController для таймаута (чтобы не висеть при блокировке сети/API)
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 4000);
    
    try {
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) throw new Error('API error');
        return await res.json();
    } catch(err) {
        clearTimeout(timeoutId);
        throw err;
    }
}

async function getAIEcoReport(locationName) {
    const aiText = document.getElementById('aiTextContent');
    if (!aiText) return;

    aiText.innerHTML = `⏳ ИИ собирает актуальные данные и историю для: <b>${locationName}</b>...`;

    const promptText = `Предоставь подробную, структурированную справку на сегодняшний день (2026 год) для локации: "${locationName}".
Включи в ответ:
1. Историческую справку (основание, ключевые вехи, развитие страны, региона или села).
2. Экологическую обстановку (строго фокус на воду, моря, океаны, прибрежные зоны, разливы, химикаты, пластик, если применимо).
Правила: Только сухие факты, цифры и четкая структура по пунктам на русском языке.`;

    try {
        const response = await fetch("https://text.pollinations.ai/" + encodeURIComponent(promptText));
        const text = await response.text();
        aiText.innerHTML = text.replace(/\n/g, '<br>');
    } catch (e) {
        aiText.innerHTML = `❌ Ошибка загрузки ИИ для ${locationName}.`;
    }
}

async function loadCountryData(){
  const code = document.getElementById('countrySelect').value;
  const obj = allCountries.find(c => c.code === code);
  if(obj) {
      map.flyTo(obj.center, obj.zoom, {duration: 1.5});
      getAIEcoReport(obj.name.replace(/^[^\s]+\s/, ''));
  }
  const list = document.getElementById('resultsList');
  list.innerHTML = '<div class="loader">⏳ Загрузка городов...</div>';
  cluster.clearLayers();
  
  const key = 'country_' + code;
  if(cache[key]){ render(cache[key]); return; }
  
  try{
    const data = await fetchWithThrottle(`https://nominatim.openstreetmap.org/search?countrycodes=${code.toLowerCase()}&format=json&addressdetails=1&limit=30&email=support@ecomap.local`);
    
    if (!data || data.length === 0) {
        throw new Error('Empty data');
    }
    
    cache[key] = data; 
    saveCache(); 
    render(data);
  }catch(e){ 
    // Если API заблокирован или недоступен — мгновенно подгружаем фоллбек-данные
    if(fallbackData[code]) {
        render(fallbackData[code]);
    } else {
        // Генерируем дефолтные точки на основе центра страны
        let gen = [];
        if(obj) {
            for(let i=0; i<5; i++) {
                gen.push({name: `${obj.name.replace(/^[^\s]+\s/, '')} - Регион ${i+1}`, lat: obj.center[0] + (Math.random()-0.5)*3, lon: obj.center[1] + (Math.random()-0.5)*3, type: 'зона'});
            }
        }
        render(gen);
    }
  }
}

function render(data){
  const list = document.getElementById('resultsList'); 
  list.innerHTML = '';
  if(!data || !data.length){ list.innerHTML = '<div class="loader">Нет данных</div>'; return; }
  
  data.forEach(i => {
    const lat = +i.lat, lng = +i.lon, name = i.name || (i.display_name ? i.display_name.split(',')[0] : 'Локация');
    const pct = hashEco(lat, lng), color = getColor(pct);
    const m = L.circleMarker([lat, lng], {radius: 8, fillColor: color, color: '#fff', weight: 1.5, fillOpacity: 0.9});
    m.bindPopup(`<b>📍 ${name}</b><br>${i.type || ''}<br>Загрязнение: <b style="color:${color}">${pct}%</b>`);
    cluster.addLayer(m);
    
    const el = document.createElement('div'); 
    el.className = 'item';
    el.innerHTML = `<div style="font-weight:600">${name}</div><div style="font-size:11px;color:#8b949e">${i.type || ''}</div><div style="font-size:11px;color:${color};font-weight:700">Загрязнение ${pct}%</div>`;
    el.onclick = () => { 
        map.flyTo([lat, lng], 11, {duration: 1.2});
        m.openPopup(); 
        getAIEcoReport(name); 
    };
    list.appendChild(el);
  });
}

async function searchLocation(){
  const q = document.getElementById('searchInput').value.trim(); 
  if(!q) return;
  
  const list = document.getElementById('resultsList'); 
  list.innerHTML = '<div class="loader">🔍 Поиск...</div>'; 
  cluster.clearLayers();
  
  const code = document.getElementById('countrySelect').value;
  try{
    const data = await fetchWithThrottle(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=${code.toLowerCase()}&limit=15&addressdetails=1&email=support@ecomap.local`);
    if(!data || data.length === 0) throw new Error('Not found');
    render(data); 
    if(data[0]) {
        map.flyTo([+data[0].lat, +data[0].lon], 11, {duration: 1.5});
        getAIEcoReport(q);
    }
  }catch(e){ 
    // Локальный поиск по фоллбеку или создание точки
    getAIEcoReport(q);
    const obj = allCountries.find(c => c.code === code);
    if(obj) {
        const lat = obj.center[0] + (Math.random()-0.5)*1;
        const lng = obj.center[1] + (Math.random()-0.5)*1;
        const pct = hashEco(lat, lng), color = getColor(pct);
        const m = L.circleMarker([lat, lng], {radius: 9, fillColor: color, color: '#fff', weight: 2, fillOpacity: 1}).bindPopup(`<b>📍 ${q}</b><br>Загрязнение ${pct}%`);
        cluster.addLayer(m); map.flyTo([lat, lng], 10); m.openPopup();
        list.innerHTML = `<div class="item" style="border-color:#58a6ff"><div style="font-weight:600">${q}</div><div style="font-size:11px;color:${color};font-weight:700">Загрязнение ${pct}%</div></div>`;
    }
  }
}

function getUserLocation(){
  if (!navigator.geolocation) {
      alert('Геолокация не поддерживается');
      return;
  }
  navigator.geolocation.getCurrentPosition(async p => {
    const lat = p.coords.latitude, lng = p.coords.longitude;
    map.flyTo([lat, lng], 12, {duration: 1.5});
    const pct = hashEco(lat, lng), color = getColor(pct);
    const name = `Ваша геопозиция`;
    const m = L.circleMarker([lat, lng], {radius: 10, fillColor: color, color: '#fff', weight: 2, fillOpacity: 1}).bindPopup(`<b>🎯 ${name}</b><br>Загрязнение ${pct}%`);
    cluster.addLayer(m); m.openPopup();
    getAIEcoReport(name);
  }, () => {
    alert('Включите доступ к геолокации в браузере.');
  }, {timeout: 8000});
}

const aiMiniInput = document.getElementById('aiMiniInput');
const aiMiniChat = document.getElementById('aiMiniChat');

function askMiniAI(){
  let q = aiMiniInput.value.trim();
  if(!q) return;
  
  let u = document.createElement('div');
  u.style.cssText = 'color:#58a6ff';
  u.textContent = '🤖 Ищу: ' + q + '...';
  aiMiniChat.prepend(u);
  aiMiniChat.scrollTop = 0;

  document.getElementById('searchInput').value = q;
  searchLocation();

  setTimeout(() => {
    let a = document.createElement('div');
    a.style.cssText = 'color:#c9d1d9;background:#161b22;border:1px solid #30363d;padding:5px 8px;border-radius:6px';
    a.innerHTML = `✅ <b>${q}</b> — локация найдена, справка загружена в ИИ-справочнике.`;
    aiMiniChat.prepend(a);
    aiMiniInput.value = '';
  }, 400);
}

document.getElementById('searchInput').addEventListener('keypress', e => { if(e.key === 'Enter') searchLocation(); });
aiMiniInput.addEventListener('keydown', e => { if(e.key === 'Enter') askMiniAI(); });

init();

window.addEventListener('load', () => { setTimeout(() => { if(window.map) map.invalidateSize(); }, 500); });
window.addEventListener('resize', () => { if(window.map) map.invalidateSize(); });
