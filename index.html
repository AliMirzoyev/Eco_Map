function init(){
  const sel=document.getElementById('countrySelect');
  sel.innerHTML='';
  allCountries.forEach(c=>{ const o=document.createElement('option'); o.value=c.code; o.textContent=c.name; if(c.code==='KZ') o.selected=true; sel.appendChild(o); });
  document.getElementById('count').textContent=allCountries.length;
  loadCountryData();
}

function getColor(p){ return p>=80?'#f85149':p>=60?'#e67e22':p>=40?'#f1c40f':'#2ea043'; }
function hashEco(lat,lng){ const h=Math.abs(Math.sin(lat*999+lng*777)*10000)%100; return Math.floor(30+h%60); }

let cache=JSON.parse(localStorage.getItem('eco_cache')||'{}');
function saveCache(){ localStorage.setItem('eco_cache', JSON.stringify(cache)); }

// Функция запроса ИИ (История и экология на сегодняшний день)
async function getAIEcoReport(locationName) {
    const aiText = document.getElementById('aiTextContent');
    if (!aiText) return;

    aiText.innerHTML = `⏳ ИИ собирает актуальные данные и историю для: <b>${locationName}</b>...`;

    const promptText = `Предоставь подробную, структурированную справку на сегодняшний день (2026 год) для локации: "${locationName}".
Включи в ответ:
1. Историческую справку (основание, ключевые вехи, развитие страны, региона или села).
2. Экологическую обстановку (строго фокус на воду, моря, океаны, прибрежные зоны, разливы, химикаты, пластик, если применимо).
Правила: Никакой пустой лирики, только сухие факты, цифры и четкая структура по пунктам на русском языке.`;

    try {
        const response = await fetch("https://text.pollinations.ai/" + encodeURIComponent(promptText));
        const text = await response.text();
        aiText.innerHTML = text.replace(/\n/g, '<br>');
    } catch (e) {
        aiText.innerHTML = `❌ Ошибка загрузки данных для ${locationName}.`;
    }
}

async function loadCountryData(){
  const code=document.getElementById('countrySelect').value;
  const obj=allCountries.find(c=>c.code===code);
  if(obj) {
      map.flyTo(obj.center, obj.zoom, {duration:0.8});
      getAIEcoReport(obj.name.replace(/^[^\s]+\s/, ''));
  }
  const list=document.getElementById('resultsList');
  list.innerHTML='<div class="loader">⏳ Загрузка городов, районов, сел...</div>';
  cluster.clearLayers();
  const key='country_'+code;
  if(cache[key]){ render(cache[key]); return; }
  try{
    const res=await fetch(`https://nominatim.openstreetmap.org/search?country=${code}&format=json&addressdetails=1&limit=50&featuretype=settlement&email=eco@atyrau.kz`);
    const data=await res.json();
    cache[key]=data; saveCache(); render(data);
  }catch(e){ list.innerHTML='<div class="loader" style="color:#f85149">Лимит, подожди 3 сек</div>'; }
}

function render(data){
  const list=document.getElementById('resultsList'); list.innerHTML='';
  if(!data||!data.length){ list.innerHTML='<div class="loader">Нет данных по этой стране</div>'; return; }
  data.forEach(i=>{
    const lat=+i.lat, lng=+i.lon, name=i.name||i.display_name.split(',')[0];
    const pct=hashEco(lat,lng), color=getColor(pct);
    const m=L.circleMarker([lat,lng],{radius:8,fillColor:color,color:'#fff',weight:1.5,fillOpacity:0.9});
    m.bindPopup(`<b>📍 ${name}</b><br>${i.type}<br>Загрязнение: <b style="color:${color}">${pct}%</b><br><small>${i.display_name}</small>`);
    cluster.addLayer(m);
    const el=document.createElement('div'); el.className='item';
    el.innerHTML=`<div style="font-weight:600">${name}</div><div style="font-size:11px;color:#8b949e">${i.type} • ${i.display_name.split(',').slice(0,2).join(',')}</div><div style="font-size:11px;color:${color};font-weight:700">Загрязнение ${pct}%</div>`;
    el.onclick=()=>{ 
        map.flyTo([lat,lng],11); 
        m.openPopup(); 
        getAIEcoReport(name); // При клике на канал Малик или любой элемент ИИ выдает историю и экологию
    };
    list.appendChild(el);
  });
}

async function searchLocation(){
  const q=document.getElementById('searchInput').value.trim(); if(!q) return;
  const list=document.getElementById('resultsList'); list.innerHTML='<div class="loader">🔍 Поиск...</div>'; cluster.clearLayers();
  const code=document.getElementById('countrySelect').value;
  try{
    const res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=${code}&limit=20&addressdetails=1&email=eco@atyrau.kz`);
    const data=await res.json(); 
    render(data); 
    if(data[0]) {
        map.flyTo([+data[0].lat,+data[0].lon],10);
        getAIEcoReport(q);
    }
  }catch(e){ list.innerHTML='<div class="loader" style="color:#f85149">Ошибка поиска</div>'; }
}

function getUserLocation(){
  navigator.geolocation.getCurrentPosition(async p=>{
    const lat=p.coords.latitude, lng=p.coords.longitude;
    map.flyTo([lat,lng],12);
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&email=eco@atyrau.kz`);
    const d=await r.json(); const name=d.address.city||d.address.village||"Моя гео";
    const pct=hashEco(lat,lng), color=getColor(pct);
    const m=L.circleMarker([lat,lng],{radius:10,fillColor:color,color:'#fff',weight:2,fillOpacity:1}).bindPopup(`<b>🎯 ${name}</b><br>Загрязнение ${pct}%`);
    cluster.addLayer(m); m.openPopup();
    getAIEcoReport(name);
  },()=>alert('Включи GPS'));
}

document.getElementById('countrySelect').addEventListener('change', loadCountryData);
document.getElementById('searchInput').addEventListener('keypress', e=>{ if(e.key==='Enter') searchLocation(); });

init();
</script>
</body>
</html>

<script>
window.addEventListener('load', ()=>{ setTimeout(()=>{ if(window.map) map.invalidateSize(); }, 500); });
window.addEventListener('resize', ()=>{ if(window.map) map.invalidateSize(); });
window.addEventListener('orientationchange', ()=>{ setTimeout(()=>{ if(window.map) map.invalidateSize(); }, 500); });

let startY=0;
const sb=document.querySelector('.sidebar');
if(sb){
  sb.addEventListener('touchstart', e=>{ startY=e.touches[0].clientY; }, {passive:true});
  sb.addEventListener('touchend', e=>{
    let diff = e.changedTouches[0].clientY - startY;
    if(diff > 100){ sb.classList.add('hidden'); if(window.map) setTimeout(()=>map.invalidateSize(),300); }
  }, {passive:true});
}
</script>
