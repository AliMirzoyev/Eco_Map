<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoEco Monitor — Экологический мониторинг Евразии</title>
    
    <!-- Подключаем стили карты Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: #1a1a1a;
            color: #ffffff;
        }

        /* Карта на весь экран */
        #map {
            flex-grow: 1;
            height: 100%;
            z-index: 1;
        }

        /* Боковая панель управления */
        #sidebar {
            width: 360px;
            background: rgba(25, 28, 36, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.5);
            z-index: 2;
            overflow-y: auto;
        }

        h1 {
            font-size: 1.4rem;
            color: #4cd137;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #aaa;
        }

        /* Карточки статистики */
        .stat-card {
            background: #2f3640;
            padding: 16px;
            border-radius: 12px;
            border-left: 4px solid #4cd137;
        }

        .stat-title {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            margin-top: 5px;
        }

        /* Легенда уровней AQI */
        .legend {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #2f3640;
            padding: 16px;
            border-radius: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .color-badge {
            width: 14px;
            height: 14px;
            border-radius: 50%;
        }

        .bg-green { background-color: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
        .bg-yellow { background-color: #f1c40f; box-shadow: 0 0 8px #f1c40f; }
        .bg-orange { background-color: #e67e22; box-shadow: 0 0 8px #e67e22; }
        .bg-red { background-color: #e74c3c; box-shadow: 0 0 8px #e74c3c; }

        /* Кнопка обновления */
        .btn-refresh {
            background: #4cd137;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-refresh:hover {
            background: #44bd32;
            transform: translateY(-2px);
        }

        /* Стили кастомных попапов карты */
        .leaflet-popup-content-wrapper {
            background: #2f3640;
            color: #fff;
            border-radius: 8px;
        }
        .leaflet-popup-tip {
            background: #2f3640;
        }
    </style>
</head>
<body>

    <!-- Карта -->
    <div id="map"></div>

    <!-- Боковая панель -->
    <div id="sidebar">
        <div>
            <h1>🌿 GeoEco Monitor</h1>
            <p class="subtitle">Мониторинг качества воздуха в реальном времени по Евразии (C++ Backend)</p>
        </div>

        <div class="stat-card">
            <div class="stat-title">Отслеживается станций</div>
            <div class="stat-value" id="stations-count">0</div>
        </div>

        <div class="stat-card" style="border-left-color: #00a8ff;">
            <div class="stat-title">Средний AQI по Евразии</div>
            <div class="stat-value" id="avg-aqi">--</div>
        </div>

        <div class="legend">
            <div class="stat-title" style="margin-bottom: 5px;">Шкала загрязнения (AQI)</div>
            <div class="legend-item"><span class="color-badge bg-green"></span> 0 - 50: Отлично</div>
            <div class="legend-item"><span class="color-badge bg-yellow"></span> 51 - 100: Умеренно</div>
            <div class="legend-item"><span class="color-badge bg-orange"></span> 101 - 150: Вредно для уязвимых</div>
            <div class="legend-item"><span class="color-badge bg-red"></span> 151+: Опасно для здоровья</div>
        </div>

        <button class="btn-refresh" onclick="loadEcoData()">🔄 Обновить данные</button>
    </div>

    <!-- Скрипт Leaflet.js -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Инициализация карты (центр на Евразию)
        const map = L.map('map').setView([48.0, 68.0], 3);

        // Тёмный стиль карты CartoDB DarkMatter (выглядит круто и современно)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        let markersGroup = L.layerGroup().addTo(map);

        // Функция определения цвета маркера
        function getAQIColor(aqi) {
            if (aqi <= 50) return '#2ecc71';
            if (aqi <= 100) return '#f1c40f';
            if (aqi <= 150) return '#e67e22';
            return '#e74c3c';
        }

        // Загрузка данных от нашего C++ сервера
        function loadEcoData() {
            fetch('/api/sensors')
                .then(response => response.json())
                .then(data => {
                    markersGroup.clearLayers();

                    let totalAqi = 0;

                    data.forEach(sensor => {
                        totalAqi += sensor.aqi;
                        const color = getAQIColor(sensor.aqi);

                        // Создаем пульсирующий круговой маркер
                        const circle = L.circleMarker([sensor.lat, sensor.lon], {
                            color: color,
                            fillColor: color,
                            fillOpacity: 0.7,
                            radius: 10 + (sensor.aqi / 20) // Чем выше загрязнение, тем крупнее точка
                        });

                        // Попап с деталями при клике
                        circle.bindPopup(`
                            <div style="font-size: 1rem; font-weight: bold; margin-bottom: 5px;">${sensor.city}, ${sensor.country}</div>
                            <div>Индекс AQI: <b style="color: ${color}; font-size: 1.1rem;">${sensor.aqi}</b></div>
                            <div style="font-size: 0.8rem; color: #aaa; margin-top: 5px;">Координаты: ${sensor.lat.toFixed(2)}, ${sensor.lon.toFixed(2)}</div>
                        `);

                        markersGroup.addLayer(circle);
                    });

                    // Обновляем статистику в боковой панели
                    document.getElementById('stations-count').innerText = data.length;
                    document.getElementById('avg-aqi').innerText = Math.round(totalAqi / data.length);
                })
                .catch(err => {
                    console.log('C++ Сервер ещё запускается или не отвечает:', err);
                });
        }

        // Автоматическая загрузка данных при открытии страницы
        loadEcoData();
    </script>
</body>
</html>
